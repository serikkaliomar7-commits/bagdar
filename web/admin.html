<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"><meta name="robots" content="noindex, nofollow"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bağdar — админ</title>
<link rel="stylesheet" href="css/app.css">
<style>
  .app { max-width: 1200px; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; margin: 18px 0; }
  .tbl-wrap { overflow-x: auto; background: var(--card); border: 1px solid var(--line); border-radius: var(--r); }
  table.adm { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  table.adm th, table.adm td { padding: 10px 12px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
  table.adm th { background: var(--soft); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--ink-3); position: sticky; top: 0; }
  table.adm tr { cursor: pointer; } table.adm tbody tr:hover { background: #fbfbff; }
  .pill { display: inline-block; padding: 2px 8px; border-radius: 99px; font-size: 12px; font-weight: 700; background: var(--soft); }
  .pill--ok { background: var(--good-soft); color: #047857; }
  dialog { border: 0; border-radius: var(--r); padding: 0; width: min(900px, 94vw); max-height: 88vh; box-shadow: var(--sh-lg); }
  dialog::backdrop { background: rgba(20,22,43,.4); }
  dialog .in { padding: 22px; overflow: auto; max-height: 88vh; }
  pre { background: var(--soft); padding: 14px; border-radius: 10px; overflow: auto; font-size: 12.5px; max-height: 360px; }
  .msgs .msg { max-width: 100%; margin-bottom: 8px; }
</style>
</head>
<body>
<header class="topbar"><span class="brand"><span class="brand__mark"></span>Bağdar · админ</span></header>
<main class="app">
  <div id="login" class="card" style="max-width:420px">
    <h2>Вход</h2>
    <p class="muted">Токен задаётся переменной окружения <code>ADMIN_TOKEN</code> на сервере.</p>
    <input id="tok" class="input" type="password" placeholder="ADMIN_TOKEN" autocomplete="off">
    <div class="actions"><button id="go" class="btn btn--primary">Войти</button></div>
    <p id="err" class="muted" style="color:var(--bad)"></p>
  </div>
  <div id="panel" hidden>
    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
      <h1 class="title" style="margin:0;flex:1">Клиенты</h1>
      <input id="q" class="input" style="max-width:240px;margin:0" placeholder="Поиск: регион, отзыв…">
      <button id="csv" class="btn btn--ghost">⬇ CSV</button>
      <button id="items" class="btn btn--ghost" title="Ответы по заданиям — для калибровки">⬇ Ответы</button>
      <button id="reload" class="btn btn--ghost">↻</button>
    </div>
    <div id="stats" class="stats"></div>
    <h2 style="margin:6px 0 0">Проверка теста (пилот)</h2>
    <div id="vstats" class="stats"></div>
    <div class="tbl-wrap"><table class="adm"><thead><tr>
      <th>Дата</th><th>Класс</th><th>Регион</th><th>Шаг</th><th>Топ-3</th><th>ИИ</th><th>Родитель</th><th>Отзыв</th>
    </tr></thead><tbody id="rows"></tbody></table></div>
  </div>
</main>
<dialog id="dlg"><div class="in" id="dlg-in"></div></dialog>

<script type="module" src="js/admin.js"></script>
</body>
</html>
